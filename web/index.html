<!DOCTYPE html>
<html>

<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Veena Music - Pioneer of Rajasthani Music">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-adsense-account" content="ca-pub-1875243491329741">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Veena">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Veena</title>
  <link rel="manifest" href="manifest.json">
  <script>
    // Bridge used by the Flutter web build to request ad fills.
    // Defined before the loader tag below so its onload/onerror always land.
    window.veenaAdsense = {
      scriptLoaded: false,
      scriptFailed: false,

      _onScriptLoad: function () {
        window.veenaAdsense.scriptLoaded = true;
      },

      _onScriptError: function () {
        window.veenaAdsense.scriptFailed = true;
        console.warn('[veena-adsense] adsbygoogle.js failed to load (ad blocker or network).');
      },

      /// Queues a fill request. AdSense binds each push to the most recently
      /// added <ins> that does not have an ad yet, so callers must push exactly
      /// once per element, after that element is in the DOM.
      requestAd: function () {
        try {
          (window.adsbygoogle = window.adsbygoogle || []).push({});
          return true;
        } catch (e) {
          console.warn('[veena-adsense] push failed', e);
          return false;
        }
      },

      /// Publisher id the loader script was actually started with. Flutter
      /// compares it against ADSENSE_CLIENT: a mismatch means every request is
      /// rejected, and it is invisible without this check.
      loaderClient: function () {
        var tag = document.querySelector(
          'script[src*="adsbygoogle.js"][src*="client="]'
        );
        if (!tag) return '';
        var match = /[?&]client=([^&]+)/.exec(tag.getAttribute('src') || '');
        return match ? decodeURIComponent(match[1]) : '';
      }
    };
  </script>

  <!-- Google AdSense loader. This tag alone never renders an ad: it only makes
       the library available. Ads appear when an <ins class="adsbygoogle">
       element is added to the page and pushed to the adsbygoogle queue, which
       Flutter does from lib/shared/widgets/adsense_ad_unit_web.dart. -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1875243491329741"
    crossorigin="anonymous" onload="window.veenaAdsense._onScriptLoad()"
    onerror="window.veenaAdsense._onScriptError()"></script>

  <!-- Aura Splash Screen Styles -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #121214;
    }

    /* Splash container */
    #splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #121214;
      z-index: 9999;
      transition: opacity 0.3s ease-out;
    }

    #splash.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* Logo container */
    .logo-container {
      width: 160px;
      height: 160px;
      border-radius: 24px;
      background: #FFFFFF;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(0.95);
      }

      50% {
        transform: scale(1.05);
      }
    }

    .inner-ring {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .core {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: white;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
    }

    .accent-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #E91E8C;
      box-shadow: 0 0 8px #E91E8C, 0 0 16px #E91E8C;
    }

    /* Typography */
    .brand-name {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 36px;
      font-weight: bold;
      letter-spacing: 12px;
      color: white;
      margin-top: 48px;
    }

    .tagline {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 4px;
      color: rgba(255, 255, 255, 0.38);
      margin-top: 16px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .tagline-line {
      width: 24px;
      height: 1px;
      background: rgba(255, 255, 255, 0.24);
    }

    /* Breathing indicator */
    .breathing-dot {
      position: fixed;
      bottom: 60px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #E91E8C;
      box-shadow: 0 0 10px #E91E8C;
      animation: breathe 2s ease-in-out infinite;
    }

    @keyframes breathe {

      0%,
      100% {
        opacity: 0;
      }

      50% {
        opacity: 1;
      }
    }
  </style>
</head>

<body>
  <!-- Aura Splash Screen -->
  <div id="splash">
    <div class="logo-container" id="splash-logo-container">
      <img id="splash-logo" src="logo_light.png" alt="Veena Logo"
        style="width: 100px; height: 100px; object-fit: contain;">
    </div>
    <div class="brand-name">VEENA</div>
    <div class="tagline">
      <span class="tagline-line"></span>
      PIONEER OF RAJASTHAN MUSIC
      <span class="tagline-line"></span>
    </div>
    <div class="breathing-dot"></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    function loadRazorpaySdk() {
      if (typeof Razorpay !== 'undefined') {
        return Promise.resolve();
      }

      var existing = document.querySelector('script[data-razorpay-sdk="1"]');
      if (existing) {
        return new Promise(function (resolve, reject) {
          if (existing.getAttribute('data-loaded') === '1') {
            resolve();
            return;
          }
          existing.addEventListener('load', function () {
            existing.setAttribute('data-loaded', '1');
            resolve();
          }, { once: true });
          existing.addEventListener('error', function () {
            reject(new Error('Razorpay SDK failed to load.'));
          }, { once: true });
        });
      }

      return new Promise(function (resolve, reject) {
        var script = document.createElement('script');
        script.src = 'https://checkout.razorpay.com/v1/checkout.js';
        script.async = true;
        script.defer = true;
        script.setAttribute('data-razorpay-sdk', '1');
        script.onload = function () {
          script.setAttribute('data-loaded', '1');
          resolve();
        };
        script.onerror = function () {
          reject(new Error('Razorpay SDK failed to load.'));
        };
        document.head.appendChild(script);
      });
    }

    // Web payment bridge used by Flutter (lib/core/services/razorpay_web_checkout_web.dart)
    window.openRazorpayCheckout = function (options) {
      loadRazorpaySdk().then(function () {
        try {
          if (typeof Razorpay === 'undefined') {
            if (options && options.onError) {
              options.onError('Razorpay SDK failed to load.');
            }
            return;
          }

          var rzp = new Razorpay({
            key: options.key,
            amount: options.amount,
            currency: options.currency,
            name: options.name,
            description: options.description,
            order_id: options.orderId,
            prefill: {
              name: options.prefillName || '',
              email: options.prefillEmail || '',
              contact: options.prefillContact || '',
            },
            handler: function (response) {
              if (options.onSuccess) {
                options.onSuccess(response);
              }
            },
            modal: {
              ondismiss: function () {
                if (options.onDismiss) {
                  options.onDismiss();
                }
              }
            },
            theme: { color: '#FF6B00' }
          });

          rzp.on('payment.failed', function (resp) {
            var message =
              (resp && resp.error && (resp.error.description || resp.error.reason)) ||
              'Payment failed';
            if (options.onError) {
              options.onError(message);
            }
          });

          rzp.open();
        } catch (e) {
          if (options && options.onError) {
            options.onError(e && e.message ? e.message : 'Unable to open checkout.');
          }
        }
      }).catch(function () {
        if (options && options.onError) {
          options.onError('Razorpay SDK failed to load.');
        }
      });
    };
  </script>
  <script>
    // Dynamically switch splash logo and background based on system theme
    (function () {
      const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const logoElement = document.getElementById('splash-logo');
      const containerElement = document.getElementById('splash-logo-container');
      const splashBg = document.getElementById('splash');

      var brandName = document.querySelector('.brand-name');
      var tagline = document.querySelector('.tagline');
      var taglineLines = document.querySelectorAll('.tagline-line');

      function applyTheme(dark) {
        if (dark) {
          logoElement.src = 'logo_dark.png';
          containerElement.style.background = '#1E1E1E';
          splashBg.style.backgroundColor = '#121214';
          brandName.style.color = 'white';
          tagline.style.color = 'rgba(255, 255, 255, 0.38)';
          taglineLines.forEach(function (l) { l.style.background = 'rgba(255, 255, 255, 0.24)'; });
        } else {
          logoElement.src = 'logo_light.png';
          containerElement.style.background = '#FFFFFF';
          splashBg.style.backgroundColor = '#F8F9FA';
          brandName.style.color = '#2D2D2D';
          tagline.style.color = 'rgba(0, 0, 0, 0.38)';
          taglineLines.forEach(function (l) { l.style.background = 'rgba(0, 0, 0, 0.12)'; });
        }
      }

      applyTheme(isDark);

      // Listen for theme changes while splash is active
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', event => {
        if (!document.getElementById('splash').classList.contains('hidden')) {
          applyTheme(event.matches);
        }
      });
    })();
  </script>
  <script>
    // Hide splash when Flutter is ready
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (splash) {
        splash.classList.add('hidden');
        setTimeout(function () {
          splash.remove();
        }, 300);
      }
    });
  </script>
</body>

</html>
